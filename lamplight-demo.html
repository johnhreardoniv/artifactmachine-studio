 gives a reason for each of you, from hours, likes and taste. Games you'd both enjoy come before ones only one of you loves.","Only games two people in different homes can play are suggested: online, or couch games over Remote Play Together. Lamplight now reads Steam's store categories to tell them apart.","Not for us takes a game off your suggestions with one friend, and Bring back returns it. The list stays on this PC and never goes on your card.","To rank a friend's games for you, Lamplight looks up store details for up to 300 of their games you don't own. Steam sees those game ids asked for from your PC, not whose card they came from.","Very large libraries are trimmed to fit a card, unliked and least-played games first."]},{version:"0.8.0",date:"2026-11-06",changes:["Invites come as links. A friend clicks one and their Lamplight opens with the code filled in; they still press Add themselves. Copy code only is there for anyone who'd rather paste.","A friend who doesn't have Lamplight yet gets a download button beside Open on the invite page, and the page keeps the code while they install it.","Make as many invites as you like, one per friend. Waiting ones are listed with when each stops working, and Cancel invite stops a code at once.","Setting up Friends now leads with joining from a friend's invite. The access-code form, only needed by whoever runs the relay, is folded away and marked Relay owner."]},{version:"0.7.0",date:"2026-11-06",changes:["Friends: pair with a friend who runs Lamplight to see what you both play, what to play together, and what they love that you haven't tried. Each pairing is just the two of you; friends of yours don't see each other.","Your card is sealed on your PC before it goes to the relay, so the relay can't read your games, your hours or your name.","An invite code works once and stops working after 7 days if nobody uses it. A friend who lost access can be sent a new one.","Friends is off until you set it up. Starting it needs an invite from a friend, or an access code from whoever runs the relay."]},{version:"0.6.0",date:"2026-11-06",changes:["Playledger is now Lamplight, with a new mark: a lamp's shade over its light.","The version and its release history moved from the sidebar to the end of Settings.","Your games, hours and settings move over by themselves the first time Lamplight starts. If autostart was on, it now starts Lamplight. End the old Playledger in Task Manager first, or it keeps your data where it was."]},{version:"0.5.0",date:"2026-11-06",changes:["Stores is now Connections: every store connects on one page, with numbered setup steps for each one, and the green button points at the next one to connect. The Steam key moved here from Settings.","Far more games from other stores find their Steam match. The rule hasn't loosened: one exact match on Steam, or none.","Games from GOG Galaxy bring their genres, critics' scores and purchase dates, and game pages show the hours and achievements other stores have for them. Connections shows how much each store filled in.",'A "Hide adult titles" setting, off by default. It keeps them out of suggestions and releases, never out of games you own.',"The sidebar folds from a small round button on its edge.","Fixed: one game Steam failed to answer for could stop achievements updating for every game."]},{version:"0.4.0",date:"2026-11-05",changes:["What to play next opens on games you already own. Wishlist, On Steam and All are one click away.","GOG Galaxy brings in the other stores you've linked in it, such as Xbox or EA, each under its own name. A game on two stores counts its larger hours, never both.","Fixed: GOG Galaxy could count games you never bought or added, and add-ons, as games you own."]},{version:"0.3.0",date:"2026-11-05",changes:["Click anywhere on a row of hours, including its bar, to open that type of game.","A new Stores page says whether GOG Galaxy, Epic and Playnite are connected, and walks through connecting each one.","Playni
